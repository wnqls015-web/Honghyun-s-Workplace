name: RP (Report) Automation

# n8n/Zapier가 Plaud 웹훅을 받으면 GitHub repository_dispatch API를 호출해
# 이 워크플로우를 트리거합니다.
# 호출 예시 (n8n HTTP Request 노드):
#   POST https://api.github.com/repos/<owner>/<repo>/dispatches
#   Headers: Authorization: token <GITHUB_TOKEN>
#   Body: { "event_type": "new-rp-transcript",
#           "client_payload": { "transcript_url": "...", "title": "...", "date": "..." } }

on:
  repository_dispatch:
    types: [new-rp-transcript]
  workflow_dispatch: {}   # 수동 실행 테스트용

jobs:
  generate-rp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r automation/rp/requirements.txt

      - name: 전사 파일 다운로드
        run: |
          curl -sL "${{ github.event.client_payload.transcript_url }}" -o transcript.txt

      - name: 회의록(RP) 생성 및 Supabase 저장
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python automation/rp/generate_rp.py \
            --input transcript.txt \
            --title "${{ github.event.client_payload.title }}" \
            --date "${{ github.event.client_payload.date }}"

      - name: 생성된 RP 파일 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: rp-report
          path: automation/rp/output/*.xlsx
