name: RP (Report) Automation

# Zapier(Plaud "Transcript & Summary Ready" 트리거 → Webhooks by Zapier 액션)가
# GitHub repository_dispatch API를 호출해 이 워크플로우를 트리거합니다.
#
# Zapier "Webhooks by Zapier" 액션 설정:
#   Method: POST
#   URL: https://api.github.com/repos/<owner>/<repo>/dispatches
#   Headers: Authorization: token <GITHUB_TOKEN>, Accept: application/vnd.github+json
#   Data (JSON):
#     { "event_type": "new-rp-transcript",
#       "client_payload": {
#         "transcript": "<Plaud 전사 텍스트 필드>",
#         "title": "<Plaud 제목 필드>",
#         "attendees": "<Plaud 참석자/화자 필드>",
#         "summary": "<Plaud 요약 필드>"
#       } }
#   transcript만 필수고 나머지는 전부 생략 가능합니다.
#   - title 없으면: Claude가 전사 내용에서 추출(AI 켜진 경우) 또는 "날짜 회의"로 표시
#   - attendees 없으면: 빈 값으로 저장
#   - summary는 ANTHROPIC_API_KEY가 없을 때(AI 미사용)만 사용됨 — PLAUD가 이미 만들어준
#     요약을 그대로 회의 내용에 담아, 전사록 원문만 덩그러니 저장되는 것보다 더 읽기 좋게 함.
#     AI를 쓰는 경우엔 Claude가 전사록 전체를 보고 직접 더 상세하게 구조화하므로 summary는 무시됨.
#   date는 생략하면 워크플로우 실행일(오늘)로 자동 설정됩니다.
#
# 생성된 RP를 이메일로도 받고 싶다면 repo Secrets에 SMTP_USER(보내는 Gmail
# 주소), SMTP_PASSWORD(Gmail 앱 비밀번호), RP_EMAIL_TO(받는 주소)를 등록하세요.
# 셋 중 하나라도 비어 있으면 이메일 발송은 자동으로 건너뜁니다.

on:
  repository_dispatch:
    types: [new-rp-transcript]
  workflow_dispatch:       # 수동 실행 테스트용 (Plaud/Zapier 없이 바로 테스트 가능)
    inputs:
      transcript:
        description: "테스트용 전사 텍스트 (비워두면 샘플 텍스트 사용)"
        required: false
        type: string

jobs:
  generate-rp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read   # ANTHROPIC_API_KEY 없을 때 GitHub Models(무료)로 전사록을 구조화하는 데 필요
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r automation/rp/requirements.txt

      - name: 전사 텍스트 준비
        env:
          TRANSCRIPT_TEXT: ${{ github.event.client_payload.transcript || github.event.inputs.transcript }}
          TRANSCRIPT_URL: ${{ github.event.client_payload.transcript_url }}
        run: |
          if [ -n "$TRANSCRIPT_TEXT" ]; then
            printf '%s' "$TRANSCRIPT_TEXT" > transcript.txt
          elif [ -n "$TRANSCRIPT_URL" ]; then
            curl -sL "$TRANSCRIPT_URL" -o transcript.txt
          else
            printf '%s' "이것은 수동 실행 테스트용 샘플 전사록입니다. 오늘 회의 안건은 A이고, 다음 주까지 B를 완료하기로 했습니다." > transcript.txt
          fi
          {
            echo "TRANSCRIPT_CONTENT<<RP_TRANSCRIPT_EOF"
            cat transcript.txt
            echo "RP_TRANSCRIPT_EOF"
          } >> "$GITHUB_ENV"

      # ANTHROPIC_API_KEY가 없을 때만 실행. GitHub가 공식 유지보수하는 액션이라
      # 엔드포인트/인증 세부사항을 직접 다루지 않아도 됨 (GITHUB_TOKEN + models: read로 동작).
      # 실패해도(continue-on-error) 다음 스텝에서 raw 모드로 안전하게 폴백.
      - name: GitHub Models로 전사록 구조화 (ANTHROPIC_API_KEY 없을 때만, 무료)
        id: gh_models
        if: ${{ !secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          prompt: |
            너는 회의 전사록을 읽고 사내 표준 회의록 양식에 맞춰 항목을 구조화하는 비서야.
            원문에 없는 내용을 지어내지 말고, 불확실한 항목은 그대로 '확인 필요'라고 표기해.
            반드시 아래 JSON 스키마 형식으로만, 다른 설명 없이 응답해:
            {
              "meeting_name": "회의명",
              "datetime": "일시",
              "location": "장소",
              "author": "작성자",
              "attendees": "참석자 (명단/역할)",
              "category": "다음 중 가장 알맞은 하나: 주간업무보고, 경영회의, 기타",
              "agenda_items": [{"agenda": "안건", "discussion": "논의 내용 (핵심만 불릿 형태로)"}],
              "instructions": [{"instruction": "지시사항", "owner": "담당자", "note": "비고(기한 등)"}]
            }

            다음 회의 전사록을 정리해줘:

            ${{ env.TRANSCRIPT_CONTENT }}

      - name: 회의록(RP) 생성 + 이메일 발송 + Supabase 저장
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RP_GITHUB_MODELS_RESPONSE: ${{ steps.gh_models.outputs.response }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RP_EMAIL_TO: ${{ secrets.RP_EMAIL_TO }}
          RP_TITLE: ${{ github.event.client_payload.title }}
          RP_DATE: ${{ github.event.client_payload.date }}
          RP_ATTENDEES: ${{ github.event.client_payload.attendees }}
          RP_SUMMARY: ${{ github.event.client_payload.summary }}
        run: |
          args=(--input transcript.txt)
          [ -n "$RP_TITLE" ] && args+=(--title "$RP_TITLE")
          [ -n "$RP_DATE" ] && args+=(--date "$RP_DATE")
          [ -n "$RP_ATTENDEES" ] && args+=(--attendees "$RP_ATTENDEES")
          [ -n "$RP_SUMMARY" ] && args+=(--summary "$RP_SUMMARY")
          python automation/rp/generate_rp.py "${args[@]}"

      - name: 생성된 RP 파일 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: rp-report
          path: automation/rp/output/*.xlsx
