name: Meeting Minutes Automation

# Zapier(Plaud "Transcript & Summary Ready" 트리거 → Webhooks by Zapier 액션)가
# GitHub repository_dispatch API를 호출해 이 워크플로우를 트리거합니다.
#
# Zapier "Webhooks by Zapier" 액션 설정:
#   Method: POST
#   URL: https://api.github.com/repos/<owner>/<repo>/dispatches
#   Headers: Authorization: token <GITHUB_TOKEN>, Accept: application/vnd.github+json
#   Data (JSON):
#     { "event_type": "new-transcript",
#       "client_payload": { "transcript": "<Plaud 전사 텍스트 필드>" } }
#   title/date는 생략 가능 — 생략 시 스크립트 기본값(제목 미정 회의 / 오늘 날짜)이 사용됩니다.

on:
  repository_dispatch:
    types: [new-transcript]
  workflow_dispatch: {}   # 수동 실행 테스트용

jobs:
  format-and-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r automation/meeting-minutes/requirements.txt

      - name: 전사 텍스트 준비
        env:
          TRANSCRIPT_TEXT: ${{ github.event.client_payload.transcript }}
          TRANSCRIPT_URL: ${{ github.event.client_payload.transcript_url }}
        run: |
          if [ -n "$TRANSCRIPT_TEXT" ]; then
            printf '%s' "$TRANSCRIPT_TEXT" > transcript.txt
          else
            curl -sL "$TRANSCRIPT_URL" -o transcript.txt
          fi

      - name: 회의록 정리 및 Supabase 저장
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MM_TITLE: ${{ github.event.client_payload.title }}
          MM_DATE: ${{ github.event.client_payload.date }}
        run: |
          args=(--input transcript.txt)
          [ -n "$MM_TITLE" ] && args+=(--title "$MM_TITLE")
          [ -n "$MM_DATE" ] && args+=(--date "$MM_DATE")
          python automation/meeting-minutes/format_minutes.py "${args[@]}"
